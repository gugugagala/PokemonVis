<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PokemonVis</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/index.css" />
</head>

<body>
    <nav class="nav" aria-label="视图切换与工具栏">
        <div class="nav-brand">
            <img class="brand-icon" src="./favicon.svg" alt="" />
            <span class="brand-name">PokemonVis</span>
        </div>
        <div class="nav-items">
            <button type="button" class="nav-item active" data-view="scatter" aria-current="true">散点图</button>
            <button type="button" class="nav-item" data-view="typechart">属性克制</button>
            <button type="button" class="nav-item" data-view="evolution">进化链</button>
            <button type="button" class="nav-item" data-view="moves">技能</button>
            <button type="button" class="nav-item" data-view="parallel">平行坐标</button>
        </div>
        <div class="nav-tools" id="nav-tools" aria-label="分享与导出"></div>
    </nav>
    <div class="menu" aria-label="筛选控件"></div>
    <div class="vis-chart" role="region" aria-label="可视化视图"></div>

    <script type="text/javascript" src="./js/d3.js"></script>
    <script type="text/javascript" src="./js/data.js"></script>
    <script type="text/javascript" src="./js/tooltip.js"></script>
    <script type="text/javascript" src="./js/radar.js"></script>
    <script type="text/javascript" src="./js/views/scatter.js"></script>
    <script type="text/javascript" src="./js/views/typechart.js"></script>
    <script type="text/javascript" src="./js/views/evolution.js"></script>
    <script type="text/javascript" src="./js/views/moves.js"></script>
    <script type="text/javascript" src="./js/views/parallel.js"></script>
    <script type="text/javascript" src="./js/app.js"></script>
</body>

</html>
